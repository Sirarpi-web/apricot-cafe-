<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apricot Cafe Menu</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --apricot: #f4a340;
      --apricot-dark: #c9652d;
      --cream: #fff7ed;
      --text: #231713;
      --muted: #746258;
      --line: #efd8c4;
      --white: #ffffff;
      --shadow: 0 18px 45px rgba(201, 101, 45, 0.16);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Montserrat", Arial, sans-serif;
      background: var(--white);
      color: var(--text);
      min-height: 100vh;
    }

    .page {
      width: min(1180px, calc(100% - 28px));
      margin: 0 auto;
      padding: 34px 0 60px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      margin-bottom: 34px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-mark {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: var(--apricot);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 24px;
      box-shadow: var(--shadow);
    }

    .brand h1 {
      font-size: clamp(28px, 5vw, 54px);
      line-height: 1;
      color: var(--text);
    }

    .brand p {
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
      margin-top: 6px;
    }

    .lang {
      display: flex;
      gap: 7px;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--cream);
      flex-shrink: 0;
    }

    .lang button {
      border: 0;
      background: transparent;
      color: var(--muted);
      font-weight: 900;
      padding: 8px 11px;
      border-radius: 999px;
      cursor: pointer;
    }

    .lang button.active {
      background: var(--apricot);
      color: #fff;
    }

    .intro {
      background: linear-gradient(135deg, #fff7ed, #ffffff);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 26px;
      margin-bottom: 24px;
      box-shadow: var(--shadow);
    }

    .intro h2 {
      font-size: clamp(26px, 4vw, 44px);
      line-height: 1.08;
      margin-bottom: 10px;
    }

    .intro h2 span {
      color: var(--apricot-dark);
      font-style: italic;
    }

    .intro p {
      color: var(--muted);
      max-width: 720px;
      font-size: 16px;
      font-weight: 500;
    }

    .categories {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 8px 0 20px;
      scrollbar-width: thin;
      margin-bottom: 12px;
    }

    .category-btn {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      border-radius: 999px;
      padding: 12px 18px;
      font-size: 14px;
      font-weight: 900;
      white-space: nowrap;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .category-btn:hover {
      transform: translateY(-2px);
      border-color: var(--apricot);
    }

    .category-btn.active {
      background: var(--apricot);
      color: #fff;
      border-color: var(--apricot);
      box-shadow: 0 12px 24px rgba(201, 101, 45, 0.22);
    }

    .menu-head {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 18px;
      margin: 18px 0 20px;
    }

    .menu-head h2 {
      font-size: clamp(28px, 4vw, 42px);
    }

    .menu-head p {
      color: var(--muted);
      font-weight: 600;
      max-width: 520px;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .menu-item {
      overflow: hidden;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: 0 10px 28px rgba(35, 23, 19, 0.05);
      transition: 0.2s ease;
    }

    .menu-item:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow);
      border-color: rgba(244, 163, 64, 0.65);
    }

    .menu-photo {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
      background: var(--cream);
    }

    .menu-info {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: start;
      padding: 18px;
    }

    .menu-item h3 {
      font-size: 17px;
      line-height: 1.25;
      margin-bottom: 7px;
    }

    .menu-item p {
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
    }

    .price {
      color: var(--apricot-dark);
      font-weight: 900;
      white-space: nowrap;
      font-size: 17px;
    }

    @media (max-width: 760px) {
      .top {
        align-items: flex-start;
        flex-direction: column;
      }

      .menu-head {
        display: block;
      }

      .menu-head p {
        margin-top: 8px;
      }

      .menu-grid {
        grid-template-columns: 1fr;
      }

      .menu-info {
        grid-template-columns: 1fr;
      }

      .menu-photo {
        height: 210px;
      }
    }
  </style>
</head>

    const menuGrid = document.getElementById("menuGrid");
    const categoryTitle = document.getElementById("categoryTitle");
    const categoryText = document.getElementById("categoryText");

    function renderStaticText() {
      document.querySelectorAll("[data-i18n]").forEach(element => {
        const key = element.dataset.i18n;
        element.textContent = translations[currentLang][key];
      });

      document.querySelectorAll("[data-i18n-html]").forEach(element => {
        const key = element.dataset.i18nHtml;
        element.innerHTML = translations[currentLang][key];
      });
    }

    function renderCategories() {
      categoriesContainer.innerHTML = "";

      categoryOrder.forEach(category => {
        const button = document.createElement("button");
        button.className = "category-btn";
        button.textContent = translations[currentLang].categories[category][0];
        button.classList.toggle("active", category === currentCategory);

        button.addEventListener("click", () => {
          currentCategory = category;
          renderCategories();
          renderMenu();
        });

        categoriesContainer.appendChild(button);
      });
    }

    function renderMenu() {
      const categoryInfo = translations[currentLang].categories[currentCategory];
      categoryTitle.textContent = categoryInfo[0];
      categoryText.textContent = categoryInfo[1];

      menuGrid.innerHTML = "";

      menu[currentLang][currentCategory].forEach((item, index) => {
        const menuItem = document.createElement("article");
        menuItem.className = "menu-item";

        menuItem.innerHTML = `
          <img class="menu-photo" src="${photos[currentCategory][index]}" alt="${item[0]}" loading="lazy">
          <div class="menu-info">
            <div>
              <h3>${item[0]}</h3>
              <p>${item[1]}</p>
            </div>
            <div class="price">${item[2]}</div>
          </div>
        `;

        menuGrid.appendChild(menuItem);
      });
    }

    function setLanguage(lang) {
      currentLang = lang;
      document.documentElement.lang = lang;

      document.querySelectorAll("[data-lang]").forEach(button => {
        button.classList.toggle("active", button.dataset.lang === lang);
      });

      renderStaticText();
      renderCategories();
      renderMenu();
    }

    document.querySelectorAll("[data-lang]").forEach(button => {
      button.addEventListener("click", () => {
        setLanguage(button.dataset.lang);
      });
    });

    setLanguage("hy");
  </script>
