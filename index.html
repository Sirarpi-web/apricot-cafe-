<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apricot Cafe — Մենյու</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Noto+Sans+Armenian:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --apricot: #f4a340;
      --apricot-dark: #c9652d;
      --cream: #fff7ed;
      --text: #231713;
      --muted: #746258;
      --line: #efd8c4;
      --white: #ffffff;
      --shadow: 0 18px 45px rgba(201, 101, 45, 0.16);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: "Montserrat", "Noto Sans Armenian", Arial, sans-serif;
      background: var(--white);
      color: var(--text);
      min-height: 100vh;
    }

    button { font-family: inherit; }
    :focus-visible { outline: 3px solid var(--apricot); outline-offset: 2px; border-radius: 8px; }

    .page { width: min(1180px, calc(100% - 28px)); margin: 0 auto; padding: 34px 0 40px; }

    .top { display: flex; justify-content: space-between; align-items: center; gap: 18px; margin-bottom: 34px; flex-wrap: wrap; }
    .brand { display: flex; align-items: center; gap: 14px; }

    .brand-mark {
      width: 54px; height: 54px; border-radius: 50%;
      background: var(--apricot); color: #fff;
      display: grid; place-items: center;
      font-weight: 900; font-size: 24px;
      box-shadow: var(--shadow);
    }

    .brand h1 { font-size: clamp(28px, 5vw, 54px); line-height: 1; color: var(--text); }
    .brand p { color: var(--muted); font-size: 14px; font-weight: 700; margin-top: 6px; }

    .lang {
      display: flex; gap: 7px; padding: 6px;
      border: 1px solid var(--line); border-radius: 999px;
      background: var(--cream); flex-shrink: 0;
    }
    .lang button {
      border: 0; background: transparent; color: var(--muted);
      font-weight: 900; padding: 8px 14px; border-radius: 999px; cursor: pointer;
      transition: 0.2s ease;
    }
    .lang button.active { background: var(--apricot); color: #fff; }

    .intro {
      background: linear-gradient(135deg, #fff7ed, #ffffff);
      border: 1px solid var(--line); border-radius: 24px;
      padding: 26px; margin-bottom: 24px; box-shadow: var(--shadow);
    }
    .intro h2 { font-size: clamp(26px, 4vw, 44px); line-height: 1.08; margin-bottom: 10px; }
    .intro h2 span { color: var(--apricot-dark); font-style: italic; }
    .intro p { color: var(--muted); max-width: 720px; font-size: 16px; font-weight: 500; }

    .categories {
      position: sticky; top: 0; z-index: 20;
      display: flex; gap: 10px; overflow-x: auto;
      padding: 14px 0; margin-bottom: 12px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      scrollbar-width: thin;
    }

    .category-btn {
      border: 1px solid var(--line); background: #fff; color: var(--text);
      border-radius: 999px; padding: 12px 20px; font-size: 14px; font-weight: 900;
      white-space: nowrap; cursor: pointer; transition: 0.2s ease;
    }
    .category-btn:hover { transform: translateY(-2px); border-color: var(--apricot); }
    .category-btn.active {
      background: var(--apricot); color: #fff; border-color: var(--apricot);
      box-shadow: 0 12px 24px rgba(201, 101, 45, 0.22);
    }

    .menu-head { display: flex; justify-content: space-between; align-items: end; gap: 18px; margin: 18px 0 24px; }
    .menu-head h2 { font-size: clamp(28px, 4vw, 42px); }
    .menu-head p { color: var(--muted); font-weight: 600; max-width: 520px; }

    .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 22px; }

    .menu-item {
      overflow: hidden; background: #fff;
      border: 1px solid var(--line); border-radius: 22px;
      box-shadow: 0 10px 28px rgba(35, 23, 19, 0.05);
      transition: 0.25s ease;
      animation: rise 0.4s ease both;
    }
    .menu-item:hover { transform: translateY(-4px); box-shadow: var(--shadow); border-color: rgba(244, 163, 64, 0.65); }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: none; }
    }

    .menu-photo { width: 100%; height: 240px; object-fit: cover; display: block; background: var(--cream); }

    .menu-info { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: start; padding: 20px; }
    .menu-item h3 { font-size: 18px; line-height: 1.25; margin-bottom: 8px; }
    .menu-item p { color: var(--muted); font-size: 14px; font-weight: 500; }
    .price { color: var(--apricot-dark); font-weight: 900; white-space: nowrap; font-size: 18px; }

    .foot {
      margin-top: 60px; padding-top: 24px;
      border-top: 1px solid var(--line);
      color: var(--muted); font-size: 14px; font-weight: 600;
      display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    }

    @media (max-width: 760px) {
      .menu-head { display: block; }
      .menu-head p { margin-top: 8px; }
      .menu-grid { grid-template-columns: 1fr; }
      .menu-info { grid-template-columns: 1fr; }
      .menu-photo { height: 220px; }
    }
  </style>
</head>

    /* ============ LOGIC ============ */
    const categoryOrder = ["breakfast", "lunch", "dinner", "coffee", "drinks", "cocktails", "desserts"];
    let currentLang = "hy";
    let currentCategory = "breakfast";

    const categoriesContainer = document.getElementById("categories");
    const menuGrid = document.getElementById("menuGrid");
    const categoryTitle = document.getElementById("categoryTitle");
    const categoryText = document.getElementById("categoryText");

    function renderStaticText() {
      document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = translations[currentLang][el.dataset.i18n]; });
      document.querySelectorAll("[data-i18n-html]").forEach(el => { el.innerHTML = translations[currentLang][el.dataset.i18nHtml]; });
    }

    function renderCategories() {
      categoriesContainer.innerHTML = "";
      categoryOrder.forEach(category => {
        const btn = document.createElement("button");
        btn.className = "category-btn";
        btn.textContent = translations[currentLang].categories[category][0];
        btn.classList.toggle("active", category === currentCategory);
        btn.addEventListener("click", () => {
          currentCategory = category;
          renderCategories();
          renderMenu();
          window.scrollTo({ top: document.querySelector(".categories").offsetTop - 10, behavior: "smooth" });
        });
        categoriesContainer.appendChild(btn);
      });
    }

    function renderMenu() {
      const info = translations[currentLang].categories[currentCategory];
      categoryTitle.textContent = info[0];
      categoryText.textContent = info[1];
      menuGrid.innerHTML = "";

      menu[currentLang][currentCategory].forEach((item, index) => {
        const article = document.createElement("article");
        article.className = "menu-item";
        article.style.animationDelay = `${index * 0.05}s`;

        const imgSrc = photos[currentCategory][index] || photoFallback(currentCategory);

        article.innerHTML = `
          <img class="menu-photo" src="${imgSrc}" alt="${item[0]}" loading="lazy"
               onerror="this.onerror=null; this.src='${photoFallback(currentCategory)}'">
          <div class="menu-info">
            <div>
              <h3>${item[0]}</h3>
              <p>${item[1]}</p>
            </div>
            <div class="price">${item[2]}</div>
          </div>
        `;
        menuGrid.appendChild(article);
      });
    }

    function setLanguage(lang) {
      currentLang = lang;
      document.documentElement.lang = lang;
      document.querySelectorAll("[data-lang]").forEach(btn => btn.classList.toggle("active", btn.dataset.lang === lang));
      renderStaticText();
      renderCategories();
      renderMenu();
    }

    document.querySelectorAll("[data-lang]").forEach(btn => btn.addEventListener("click", () => setLanguage(btn.dataset.lang)));

    setLanguage("hy");
  </script>
